project:
  type: website
  output-dir: docs
  post-render: _idiomas.R   # gera docs/es e docs/en automaticamente
  resources:
    - /assets/images/hero/*
    - /assets/images/logos/**
    - /assets/images/galeria/*

# ------------------------------------------------------------------
# IDIOMAS
# Este arquivo tem as configurações comuns aos 3 idiomas.
# O menu e o rodapé de cada idioma ficam em:
#   _quarto-pt.yml (padrão)  |  _quarto-es.yml  |  _quarto-en.yml
# As páginas traduzidas ficam nas pastas es/ e en/ (mesmo nome do arquivo).
# Para gerar o site completo: aba Build -> "Render Website"
# (ou source("render_site.R")). O script _idiomas.R faz o resto.
#
# CONTEÚDO QUE MUDA COM FREQUÊNCIA (não precisa mexer nas páginas):
#   dados/cursos.csv     -> cursos realizados, em andamento e previstos
#   dados/equipe.csv     -> equipe
#   dados/herbarios.csv  -> herbários e parceiros
#   publicacoes/publicacoes.bib -> publicações
# ------------------------------------------------------------------
profile:
  default: pt

website:
  title: "HerbSpectra-Amazônia"
  site-url: https://herbspectraamazonia.github.io
  favicon: assets/images/favicon.ico
  image: assets/images/logo-web.png
  open-graph: true
  search: false
  page-navigation: false
  back-to-top-navigation: false

execute:
  echo: false
  warning: false
  message: false

format:
  html:
    theme: [cosmo, assets/herbspectra.scss]
    toc: false
    title-block-style: none
    lightbox: true
    smooth-scroll: true
    include-in-header: assets/html/head.html
    include-after-body: [assets/html/idiomas.html, assets/html/efeitos.html]

editor: source   # "source" evita que o editor visual do RStudio reformate as páginas
